<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 10 478 154" width="478" height="154" preserveAspectRatio="xMidYMid meet">

  <!-- ======================== -->
  <!-- MAP PIN (teardrop)        -->
  <!-- cx=80, cy=66, r=52       -->
  <!-- tip at y=146             -->
  <!-- ======================== -->
  <path
    d="M 28 66
       A 52 52 0 1 1 132 66
       C 132 98, 104 120, 80 146
       C 56 120, 28 98, 28 66
       Z"
    fill="#1a1a1a"
  />

  <!-- White inner circle -->
  <circle cx="80" cy="66" r="36" fill="white" />

  <!-- Bar from right-edge of pin to right edge of text -->
  <rect x="132" y="25" width="372" height="8" fill="#1a1a1a" rx="1"/>

  <!-- ======================== -->
  <!-- SIGNAL / ANTENNA ICON    -->
  <!-- anchored at cx=80, cy=53 -->
  <!-- ======================== -->
  <circle cx="80" cy="53" r="4.5" fill="#1a1a1a" />
  <rect x="78" y="53" width="4" height="22" fill="#1a1a1a" />
  <rect x="73" y="75" width="14" height="5.5" rx="1.5" fill="#1a1a1a" />

  <!-- Left arcs -->
  <path d="M 69 42 A 13 13 0 0 0 69 64" fill="none" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 61 34 A 21 21 0 0 0 61 72" fill="none" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Right arcs -->
  <path d="M 91 42 A 13 13 0 0 1 91 64" fill="none" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 99 34 A 21 21 0 0 1 99 72" fill="none" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>

  <!-- ======================== -->
  <!-- TEXT                     -->
  <!-- ======================== -->
  <text
    x="150"
    y="68"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="34"
    fill="#1a1a1a"
    letter-spacing="-0.5"
  >JMW INTELLIGENT</text>

  <text
    x="504"
    y="100"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="23"
    fill="#1a1a1a"
    letter-spacing="2"
    text-anchor="end"
  >SOLUTIONS</text>

</svg>
